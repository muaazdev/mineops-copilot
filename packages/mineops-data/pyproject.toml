[project]
name = "mineops-data"
version = "0.1.0"
description = "MineOps domain models, migrations, synthetic data generator, named SQL queries"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mineops-core",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "numpy==2.5.4",
  "typer==0.27.3",
]

[project.scripts]
mineops-data = "mineops_data.cli:app"

[tool.uv.sources]
mineops-core = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mineops_data"]
