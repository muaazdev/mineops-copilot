# Alembic config for the MineOps schema. Run from repo root:
#   uv run alembic -c packages/mineops-data/alembic.ini upgrade head
# The DB URL is NOT here: env.py takes it from mineops_core settings (MINEOPS_DB__*),
# unless a caller (tests) sets sqlalchemy.url programmatically.
[alembic]
script_location = %(here)s/src/mineops_data/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
