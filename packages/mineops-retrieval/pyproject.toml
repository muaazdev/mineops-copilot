[project]
name = "mineops-retrieval"
version = "0.1.0"
description = "MineOps hybrid retrieval: chunking, OpenSearch BM25, Qdrant dense, RRF, rerank"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mineops-core",
  "opensearch-py==3.2.0",
  "qdrant-client==1.19.1",
  # sentence-transformers==6.1.0 + torch==2.14.1 (CPU) are added once download-r2.pytorch.org
  # is reachable; see docs/milestones/M02-retrieval.md.
  "tokenizers==0.23.3",
  "huggingface-hub==2.2.0",
  "markdown-it-py==4.2.0",
  "pyyaml==6.0.3",
  "typer==0.27.3",
]

[project.scripts]
mineops-retrieval = "mineops_retrieval.cli:app"

[tool.uv.sources]
mineops-core = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mineops_retrieval"]
