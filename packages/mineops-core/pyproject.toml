[project]
name = "mineops-core"
version = "0.1.0"
description = "Shared settings, logging, and errors for MineOps services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mineops_core"]
