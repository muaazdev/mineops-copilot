name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --all-packages --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pre-pull images (testcontainers)
        run: |
          docker pull -q postgres:16.15
          docker pull -q opensearchproject/opensearch:3.9.0
          docker pull -q qdrant/qdrant:v1.19.2
      - name: Pytest
        run: uv run pytest --cov=mineops_core --cov=mineops_data --cov=mineops_retrieval --cov-report=term
